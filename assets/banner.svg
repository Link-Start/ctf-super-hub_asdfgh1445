  <circle cx="96" cy="408" r="3" fill="url(#rivet)"/>
  <circle cx="318" cy="408" r="3" fill="url(#rivet)"/>
  <circle cx="96" cy="428" r="3" fill="url(#rivet)"/>
  <circle cx="318" cy="428" r="3" fill="url(#rivet)"/>
  <text x="116" y="424" font-weight="700" font-size="16" fill="#FF7A18">v1.1.0 · 编排化架构</text>

