  <rect x="1080" y="128" width="436" height="42" fill="#FF7A18"/>
  <line x1="1080" y1="170" x2="1516" y2="170" stroke="#121213" stroke-width="2"/>
  <circle cx="1092" cy="149" r="3.5" fill="#121213"/>
